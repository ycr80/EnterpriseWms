name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Restore
        run: dotnet restore tests/EnterpriseWms.Tests/EnterpriseWms.Tests.csproj --configfile NuGet.Config

      - name: Build backend and tests
        run: dotnet build tests/EnterpriseWms.Tests/EnterpriseWms.Tests.csproj --configuration Release --no-restore

      - name: Run tests with SQL Server LocalDB
        run: dotnet test tests/EnterpriseWms.Tests/EnterpriseWms.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=enterprise-wms-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-wms-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
